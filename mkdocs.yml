site_name: Research and Desire — Developer Docs
site_url: https://dev.researchanddesire.com/
repo_url: https://github.com/researchanddesire/dev-docs
repo_name: dev-docs

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: cyan

plugins:
  - search
  - awesome-pages

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

# Navigation is driven by .pages files (mkdocs-awesome-pages-plugin) so the full
# tree assembled from each product repo's developer-docs/ shows up automatically.
# Top-level order/titles live in docs/.pages; product order lives in each product's
# developer-docs/docs/.pages. Product sections under docs/lockbox, docs/dtt, etc.
# are CI-assembled — do not edit those paths by hand.
