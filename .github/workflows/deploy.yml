name: Deploy developer docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/**'
  repository_dispatch:
    types: [dev-docs-rebuild]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Write deploy keys for private OSS forks
        run: |
          mkdir -p "$RUNNER_TEMP/assemble-keys"
          printf '%s\n' "${{ secrets.ASSEMBLE_SSH_KEY_LOCKBOX }}" > "$RUNNER_TEMP/assemble-keys/Lockbox-OSS"
          printf '%s\n' "${{ secrets.ASSEMBLE_SSH_KEY_DTT }}"     > "$RUNNER_TEMP/assemble-keys/DT_Trainer-OSS"
          printf '%s\n' "${{ secrets.ASSEMBLE_SSH_KEY_RADR }}"    > "$RUNNER_TEMP/assemble-keys/RADR-OSS"
          printf '%s\n' "${{ secrets.ASSEMBLE_SSH_KEY_OSSM }}"    > "$RUNNER_TEMP/assemble-keys/ossm"
          chmod 600 "$RUNNER_TEMP/assemble-keys/"*

      - name: Assemble product developer-docs
        env:
          # Per-repo read-only deploy keys (machine credentials, not a personal
          # token). At cutover the repos become public and keys are unneeded.
          ASSEMBLE_SSH_DIR: ${{ runner.temp }}/assemble-keys
        run: |
          chmod +x scripts/assemble-docs.sh
          ./scripts/assemble-docs.sh

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install MkDocs
        run: pip install -r requirements.txt

      - name: Build
        run: mkdocs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publish:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
